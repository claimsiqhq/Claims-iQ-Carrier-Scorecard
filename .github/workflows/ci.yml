name: Complete iQ quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: complete-iq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/complete_iq_test
      SUPABASE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/complete_iq_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: complete_iq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d complete_iq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Rehearse tenant migration
        run: pnpm --filter @workspace/scripts rehearse:migration

      - name: Run automated tests
        run: pnpm -r --if-present test

      - name: Build production artifacts
        run: pnpm build

      - name: Verify generated API clients
        run: |
          pnpm --filter @workspace/api-spec codegen
          git diff --exit-code -- lib/api-client-react/src lib/api-zod/src

      - name: Audit production dependencies
        run: pnpm audit --production --audit-level high
