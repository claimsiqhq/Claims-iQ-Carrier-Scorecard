      tags: [Administration]
      summary: List tenants available for audited platform access
      description: |
        Requires platform administrator access. Returns organization identity
        metadata only; it does not expose tenant metrics or establish tenant
        context.
      responses:
        "200":
          description: Tenant identities available to the platform administrator.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformTenantSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /platform/tenant-access:
    post:
      operationId: enterPlatformTenant
      tags: [Authentication, Administration]
      summary: Start temporary audited tenant access
      description: |
        Requires platform administrator access and a specific operational
        reason. Creates a time-limited tenant-access lease and binds it to the
        authenticated session, replacing any prior lease for that session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformTenantAccessRequest"
      responses:
        "200":
          description: Session metadata with the active platform tenant lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: exitPlatformTenant
      tags: [Authentication, Administration]
      summary: End temporary audited tenant access
      description: |
        Requires platform administrator access. Revokes the current
        session-bound tenant-access lease and clears tenant context from the
        authenticated session.
      responses:
        "200":
          description: Session metadata with no active tenant context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

