          description: Active carriers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CarrierOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
