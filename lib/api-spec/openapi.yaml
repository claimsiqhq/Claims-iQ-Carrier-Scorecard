        "200":
          description: Raw document bytes using the stored content type when available.
          headers:
            Content-Length:
              schema:
                type: integer
                format: int64
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /documents/{documentId}/signed-url:
    get:
      operationId: getDocumentSignedUrl
      tags: [Documents]
      summary: Create an authorized document signed URL
      description: Requires `claims:read`; the returned URL expires after 120 seconds.
      parameters:
        - $ref: "#/components/parameters/DocumentIdPath"
