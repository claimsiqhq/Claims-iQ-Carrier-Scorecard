        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /processing-jobs/{jobId}/retry:
    post:
      operationId: retryProcessingJob
      tags: [Jobs]
      summary: Retry a terminal processing job
      description: Requires `jobs:retry`. Only failed, degraded, or cancelled jobs can be reset to queued.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: Existing durable job reset and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJobEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
