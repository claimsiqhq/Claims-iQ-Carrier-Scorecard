    SendEmailRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: email
        subject:
          type: string
      additionalProperties: false

    InboundEmailRequest:
      type: object
      description: |
        SendGrid Inbound Parse multipart fields. `from` and either report text
        or a PDF attachment are needed for asynchronous processing, although
        the callback acknowledges the multipart payload before that work runs.
      properties:
        from:
          type: string
        subject:
          type: string
          maxLength: 120
        text:
          type: string
        html:
          type: string
        attachments:
          type: array
          maxItems: 10
          items:
            type: string
            format: binary
      additionalProperties: true
