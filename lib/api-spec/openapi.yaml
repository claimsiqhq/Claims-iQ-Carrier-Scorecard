openapi: 3.0.3
info:
  title: Api
  version: 1.0.0
  description: |
    Typed contract for the Complete iQ Carrier Audit API.

    Authenticated requests use the `sid` HTTP-only session cookie. Ordinary
    tenant context is bound by the server from exactly one organization
    membership; accounts with zero or multiple memberships cannot access
    tenant routes. Tenant-selection headers and request-body overrides are
    rejected.

    Platform administrators have no tenant context by default. They use the
    reason-required `/platform/tenant-access` endpoints to create or revoke a
    temporary, audited lease bound to the authenticated session. Tenant-scoped
    lookups deliberately return `404` when a resource belongs to another
    tenant so that cross-tenant identifiers are not disclosed.

    Job-enqueueing operations that accept `X-Idempotency-Key` scope that value
    to the authenticated session-bound tenant and operation inputs. Repeating
    an equivalent request returns the existing durable processing job and sets
    `duplicate` to `true` when that field is present.
servers:
  - url: /api
    description: Application API
security:
  - cookieAuth: []
tags:
  - name: Health
    description: Service health and operational metrics.
  - name: Authentication
    description: Session lifecycle and server-bound tenant context.
  - name: Dashboard
    description: Organization-scoped dashboard aggregates.
  - name: Claims
    description: Claim records and current audit detail.
  - name: Workflow
    description: Assignment, human review, findings, activity, and saved views.
  - name: Intake
    description: Claim-file intake and processing state.
  - name: Jobs
    description: Durable processing jobs and attempts.
  - name: Audits
    description: Asynchronous carrier-audit execution.
  - name: Documents
    description: Authorized document registration, extraction, and delivery.
  - name: Carriers
    description: Carrier choices and administrator-managed rulesets.
  - name: Settings
    description: Administrator-managed audit prompt settings.
  - name: Email
    description: Audit email preview and delivery.
  - name: Webhooks
    description: Root-mounted callbacks from trusted external services.
  - name: Administration
    description: Session-protected operational and global administration endpoints.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Check service health
      description: Checks database connectivity and returns `503` when a dependency is degraded.
      security: []
      responses:
        "200":
          description: All health checks passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: One or more health checks failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /metrics:
    get:
      operationId: getMetrics
      tags: [Health, Administration]
      summary: Read in-memory request metrics
      description: Returns per-route request counts, average latency, and error counts for this process.
      responses:
        "200":
          description: Current process-local route metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/user:
    get:
      operationId: getAuthSession
      tags: [Authentication]
      summary: Get the current session
      description: "Returns `user: null` when no valid session cookie is present."
      security:
        - {}
        - cookieAuth: []
      responses:
        "200":
          description: Current user and server-bound tenant context, if authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Create a session
      description: |
        Validates credentials and sets the HTTP-only `sid` cookie (`Secure`
        outside development). Failed sign-in attempts are limited to 10 per
        15 minutes; successful requests do not count against that limiter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Credentials accepted and session created.
          headers:
            Set-Cookie:
              description: HTTP-only session cookie, marked Secure outside development.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Clear the current session
      description: Deletes the server-side session when present and clears the `sid` cookie.
      security:
        - {}
        - cookieAuth: []
      responses:
        "200":
          description: Session cleared or no session was present.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      tags: [Authentication]
      summary: Request a password reset link
      description: Always returns the same accepted response to prevent account enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: Recovery request accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password/reset/inspect:
    post:
      operationId: inspectPasswordReset
      tags: [Authentication]
      summary: Validate a password reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTokenRequest"
      responses:
        "200":
          description: Token is currently valid.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid:
                    type: boolean
                    enum: [true]
                additionalProperties: false
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Authentication]
      summary: Consume a password reset token
      description: Replaces the password and revokes every active session for the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset and sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/password/change:
    post:
      operationId: changePassword
      tags: [Authentication]
      summary: Change the signed-in user's password
      description: Verifies the current password and revokes every active session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed and sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/invitations/inspect:
    post:
      operationId: inspectInvitation
      tags: [Authentication]
      summary: Validate and describe an organization invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTokenRequest"
      responses:
        "200":
          description: Active invitation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Authentication]
      summary: Accept an organization invitation
      description: Creates a new account when needed or verifies the password of an existing account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Invitation accepted and membership activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptInvitationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [Dashboard]
      summary: Get dashboard aggregates
      description: Requires the `claims:read` organization permission.
      responses:
        "200":
          description: Organization-scoped claim, score, carrier, and finding aggregates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /insights:
    get:
      operationId: getInsights
      tags: [Dashboard]
      summary: Get organization quality and workflow insights
      description: Requires the `claims:read` organization permission.
      responses:
        "200":
          description: Carrier, reviewer, scoring, evidence, and processing-quality aggregates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insights"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims:
    get:
      operationId: listClaims
      tags: [Claims]
      summary: List claims
      description: |
        Returns claims in descending creation order for the authenticated
        session-bound tenant.
        Requires `claims:read`. Pagination is offset-based and the response is a
        bare array; the active route does not return a total count.
      parameters:
        - $ref: "#/components/parameters/ClaimsLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of claim summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createClaim
      tags: [Claims]
      summary: Create a claim record
      description: Creates a pending claim without uploading a source file. Requires `claims:create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClaimRequest"
      responses:
        "201":
          description: Claim created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/queue:
    get:
      operationId: getClaimsQueue
      tags: [Claims]
      summary: Query the operational claims queue
      description: |
        Returns an organization-scoped, server-filtered and sorted page for the
        operational queue. Requires `claims:read`.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: carrier
          in: query
          schema: { type: string, default: all }
        - name: status
          in: query
          schema: { type: string, default: all }
        - name: risk
          in: query
          schema: { type: string, default: all }
        - name: readiness
          in: query
          schema: { type: string, default: all }
        - name: preset
          in: query
          schema:
            type: string
            enum: [all, mine, review, processing, risk, exceptions, custom]
            default: all
        - name: sort
          in: query
          schema:
            type: string
            enum: [received, claim, carrier, score]
            default: received
      responses:
        "200":
          description: Filtered operational queue page and available carrier facets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimsQueueResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/archive:
    post:
      operationId: archiveClaims
      tags: [Claims]
      summary: Archive selected claims
      description: |
        Atomically removes 1–100 organization-scoped claims from active work while
        retaining source records and append-only audit provenance. Claims with queued
        or running processing jobs are rejected. Requires `claims:delete`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveClaimsRequest"
      responses:
        "200":
          description: Selected claims are archived or were already archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveClaimsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/assignees:
    get:
      operationId: listClaimAssignees
      tags: [Claims]
      summary: List available claim assignees
      description: Returns organization members available for claim assignment. Requires `claims:read`.
      responses:
        "200":
          description: Organization-scoped assignment directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimAssigneesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}:
    parameters:
      - $ref: "#/components/parameters/ClaimId"
    get:
      operationId: getClaimDetail
      tags: [Claims]
      summary: Get claim detail
      description: |
        Returns the claim, authorized documents, and the latest audit. Requires
        `claims:read`. A claim owned by another organization is reported as not found.
      responses:
        "200":
          description: Claim detail with current audit when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: archiveClaim
      tags: [Claims]
      summary: Archive a claim
      description: |
        Marks the claim and system workflow as archived while retaining append-only
        audit provenance. Requires `claims:delete`; this is not a physical deletion.
      responses:
        "200":
          description: Claim archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/assignment:
    patch:
      operationId: updateClaimAssignment
      tags: [Workflow]
      summary: Assign or unassign a claim
      description: |
        Requires `claims:assign`. The assignee must be a member of the
        authenticated session-bound tenant; a cross-tenant or unknown assignee
        is reported as not found.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentRequest"
      responses:
        "200":
          description: Updated assignment and resulting review status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/review-status:
    patch:
      operationId: updateClaimReviewStatus
      tags: [Workflow]
      summary: Update human review status
      description: Requires `findings:review`.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewStatusRequest"
      responses:
        "200":
          description: Updated human review status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/findings/{findingId}:
    patch:
      operationId: updateClaimFinding
      tags: [Workflow]
      summary: Review an audit finding
      description: |
        Updates disposition and reviewer notes. `overrideReason` is required when
        disposition is `overridden`. Requires `findings:review`.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/FindingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFindingRequest"
      responses:
        "200":
          description: Updated finding review fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/activity:
    get:
      operationId: listClaimActivity
      tags: [Workflow]
      summary: List claim activity
      description: Returns newest activity first. Requires `claims:read`.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/ActivityLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of claim activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /saved-views:
    get:
      operationId: listSavedViews
      tags: [Workflow]
      summary: List the current user's saved views
      description: Requires `views:manage`; results are scoped to the authenticated session-bound tenant and current user.
      parameters:
        - name: resourceType
          in: query
          required: false
          description: Resource family to list.
          schema:
            type: string
            default: claims
      responses:
        "200":
          description: Saved views ordered by default status and name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedViewPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      operationId: createSavedView
      tags: [Workflow]
      summary: Create a saved view
      description: |
        Requires `views:manage`. Setting `isDefault` clears the default flag on
        the current user's other views for the same resource type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedViewRequest"
      responses:
        "201":
          description: Saved view created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /saved-views/{viewId}:
    parameters:
      - $ref: "#/components/parameters/SavedViewId"
    put:
      operationId: updateSavedView
      tags: [Workflow]
      summary: Update a saved view
      description: Requires `views:manage`; only the owning user in the authenticated session-bound tenant can update it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSavedViewRequest"
      responses:
        "200":
          description: Saved view updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      operationId: deleteSavedView
      tags: [Workflow]
      summary: Delete a saved view
      description: Requires `views:manage`; only the owning user in the authenticated session-bound tenant can delete it.
      responses:
        "200":
          description: Saved view deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
