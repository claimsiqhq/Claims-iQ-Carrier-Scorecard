        "500":
          $ref: "#/components/responses/InternalServerError"

  /processing-jobs/{jobId}/cancel:
    post:
      operationId: cancelProcessingJob
      tags: [Jobs]
      summary: Cancel a processing job
      description: Requires `jobs:cancel`. Only queued or running jobs can be cancelled.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingJobEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
