          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /platform/carriers/{key}/versions:
    get:
      operationId: listCarrierVersions
      tags: [Carriers, Administration]
      summary: List immutable carrier ruleset versions
      description: Requires platform administrator access and an active tenant lease.
      parameters:
        - $ref: "#/components/parameters/CarrierKey"
      responses:
        "200":
          description: Version history and session-bound tenant impact count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierVersionHistory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /platform/carriers/{key}/versions/{versionId}/publish:
    post:
      operationId: publishCarrierVersion
      tags: [Carriers, Administration]
      summary: Approve and publish a draft ruleset version
      description: Requires platform administrator access and an active tenant lease; validates the persisted draft before publication.
      parameters:
        - $ref: "#/components/parameters/CarrierKey"
        - $ref: "#/components/parameters/CarrierVersionId"
      responses:
        "200":
          description: Published version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /platform/carriers/{key}/versions/{versionId}/rollback:
    post:
      operationId: rollbackCarrierVersion
      tags: [Carriers, Administration]
      summary: Restore a historical publication as a new version
      description: Requires platform administrator access and an active tenant lease; prior versions remain immutable.
      parameters:
        - $ref: "#/components/parameters/CarrierKey"
        - $ref: "#/components/parameters/CarrierVersionId"
      responses:
        "200":
          description: Newly created rollback publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierVersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /platform/carriers/{key}/test:
    post:
      operationId: testCarrierVersion
      tags: [Carriers, Administration]
      summary: Run deterministic representative-claim ruleset preflight
      description: |
        Requires platform administrator access and an active tenant lease. This does not call the AI
        provider and does not mutate the representative claim.
      parameters:
        - $ref: "#/components/parameters/CarrierKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarrierPreflightRequest"
      responses:
        "200":
          description: Ruleset compatibility and coverage result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarrierPreflightResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/overview:
    get:
      operationId: getSettingsOverview
      tags: [Settings, Administration]
      summary: Get organization administration overview
      description: Requires `settings:manage` in the authenticated session-bound tenant.
      responses:
        "200":
          description: Members, integration readiness, security policy, retention, and audit history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/organization:
    put:
      operationId: updateOrganizationSettings
      tags: [Settings, Administration]
      summary: Update organization notification and retention policy
      description: Requires `settings:manage`. This records policy only and does not delete retained data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSettingsInput"
      responses:
        "200":
          description: Updated organization settings row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/members/{membershipId}:
    patch:
      operationId: updateOrganizationMemberRole
      tags: [Settings, Administration]
      summary: Update an organization member role
      description: Requires `settings:manage`; privileged role changes require an organization owner.
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/OrganizationRole"
              additionalProperties: false
      responses:
        "200":
          description: Updated membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMemberRole"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/invitations:
    post:
      operationId: inviteOrganizationMember
      tags: [Settings, Administration]
      summary: Send an organization invitation
      description: Requires `settings:manage`; privileged role invitations require an owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitation created and delivery accepted by the email provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/invitations/{invitationId}:
    delete:
      operationId: revokeOrganizationInvitation
      tags: [Settings, Administration]
      summary: Revoke a pending organization invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/invitations/{invitationId}/resend:
    post:
      operationId: resendOrganizationInvitation
      tags: [Settings, Administration]
      summary: Rotate and resend a pending invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation rotated and resent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitationDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/members/{membershipId}/password-reset:
    post:
      operationId: sendOrganizationMemberPasswordReset
      tags: [Settings, Administration]
      summary: Send a member a password reset link
      parameters:
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Password reset delivery accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/prompts:
    get:
      operationId: getPromptSettings
      tags: [Settings, Administration]
      summary: Get audit prompt settings
      description: Requires `settings:manage`; organization defaults are returned when no overrides are stored.
      responses:
        "200":
          description: Effective audit prompts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromptSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      operationId: updatePromptSettings
      tags: [Settings, Administration]
      summary: Replace audit prompt settings
      description: |
        Requires `settings:manage`. Both prompts must be non-empty, and
        `user_prompt_template` must include all required question and report placeholders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptSettings"
      responses:
        "200":
          description: Prompt overrides stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /settings/prompts/reset:
    post:
      operationId: resetPromptSettings
      tags: [Settings, Administration]
      summary: Reset audit prompts
      description: Deletes organization-scoped overrides and returns built-in defaults. Requires `settings:manage`.
      responses:
        "200":
          description: Prompt settings reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPromptSettingsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/email:
    get:
      operationId: previewAuditEmail
      tags: [Email]
      summary: Preview the current audit email
      description: Requires `claims:read`; returns `404` until the claim has a persisted audit response.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Rendered HTML email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/email/send:
    post:
      operationId: sendAuditEmail
      tags: [Email]
      summary: Send the current audit email
      description: |
        Requires `email:send` and a persisted audit. Delivery is limited to
        10 requests per hour.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailRequest"
      responses:
        "200":
          description: Email sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /email/inbound:
    post:
      operationId: receiveInboundEmail
      tags: [Webhooks]
      summary: Acknowledge a SendGrid inbound email
      description: |
        Root-mounted SendGrid Inbound Parse callback (outside `/api`). A valid
        query token is required. The route acknowledges accepted payloads with
        plain-text `ok` before asynchronously resolving the sender's organization,
        extracting a report, running the carrier scorecard audit, and sending a
        reply. A `200` acknowledgement does not guarantee asynchronous processing
        success. The generated browser and Zod clients exclude this operation
        because it uses a different server base.
      servers:
        - url: /
          description: Root-mounted external webhook
      security:
        - inboundToken: []
      parameters:
        - name: X-Request-Id
          in: header
          required: false
          description: Optional caller correlation ID; the server creates one when omitted.
          schema:
            type: string
        - name: token
          in: query
          required: true
          description: Shared Inbound Parse callback token.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/InboundEmailRequest"
      responses:
        "200":
          description: Payload acknowledged and asynchronous processing scheduled.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]
        "401":
          description: Callback token is invalid.
          content:
            text/plain:
              schema:
                type: string
                enum: [unauthorized]
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: Inbound parsing is disabled because no callback token is configured.
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: HTTP-only server session cookie, marked Secure outside development.
    inboundToken:
      type: apiKey
      in: query
      name: token
      description: Shared secret configured for the SendGrid Inbound Parse callback.

  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: |
        Caller-provided idempotency key. It is combined with the authenticated
        session-bound tenant and operation-specific inputs; equivalent requests
        reuse the durable job.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ClaimId:
      name: id
      in: path
      required: true
      description: Claim identifier.
      schema:
        type: string
        format: uuid
    FindingId:
      name: findingId
      in: path
      required: true
      description: Audit finding identifier.
      schema:
        type: string
        format: uuid
    DocumentId:
      name: docId
      in: path
      required: true
      description: Claim document identifier.
      schema:
        type: string
        format: uuid
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      description: Document identifier.
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      description: Durable processing job identifier.
      schema:
        type: string
        format: uuid
    SavedViewId:
      name: viewId
      in: path
      required: true
      description: Saved view identifier.
      schema:
        type: string
        format: uuid
    CarrierKey:
      name: key
      in: path
      required: true
      description: Stable normalized carrier key.
      schema:
        type: string
        minLength: 1
    CarrierVersionId:
      name: versionId
      in: path
      required: true
      description: Immutable carrier ruleset version identifier.
      schema:
        type: string
        format: uuid
    CarrierEntityId:
      name: entityId
      in: path
      required: true
      description: Tenant-owned carrier entity identifier.
      schema:
        type: string
        format: uuid
    ClaimsLimit:
      name: limit
      in: query
      required: false
      description: Maximum claims to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    ActivityLimit:
      name: limit
      in: query
      required: false
      description: Maximum activity records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    JobsLimit:
      name: limit
      in: query
      required: false
      description: Maximum jobs to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Zero-based record offset.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    BadRequest:
      description: Request parameters or body failed route validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: A valid authenticated session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The session lacks a valid tenant context or the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        Resource not found in the authenticated session-bound tenant.
        Tenant-scoped routes use this response for cross-tenant identifiers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The resource state does not permit the requested transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: The single-use token is invalid, expired, revoked, or already consumed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Uploaded content exceeds the route limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Request rate limit exceeded.
      headers:
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: The server could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: A required upstream delivery provider rejected or failed the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required integration is not configured or temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: Shared JSON error payload.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Optional stable machine-readable code.
        details:
          description: Optional structured diagnostic context.
          nullable: true
        requestId:
          type: string
          description: Optional request correlation identifier.
      additionalProperties: false

    Success:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
      additionalProperties: false

    HealthCheckState:
      type: string
      enum: [ok, error]

    HealthStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          required: [database]
          properties:
            database:
              $ref: "#/components/schemas/HealthCheckState"
          additionalProperties:
            $ref: "#/components/schemas/HealthCheckState"
      additionalProperties: false

    RouteMetric:
      type: object
      required: [count, avgMs, errors]
      properties:
        count:
          type: integer
          minimum: 0
        avgMs:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
      additionalProperties: false

    RequestMetrics:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/RouteMetric"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          format: password
      additionalProperties: false

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
      additionalProperties: false

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
      additionalProperties: false

    AccountTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 40
          maxLength: 60
      additionalProperties: false

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 40
          maxLength: 60
        password:
          type: string
          format: password
          minLength: 12
          description: Must not exceed bcrypt's 72-byte UTF-8 input limit.
      additionalProperties: false

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
        newPassword:
          type: string
          format: password
          minLength: 12
          description: Must not exceed bcrypt's 72-byte UTF-8 input limit.
      additionalProperties: false

    InvitationPreview:
      type: object
      required: [email, role, organizationName, expiresAt, accountExists]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/OrganizationRole"
        organizationName:
          type: string
        expiresAt:
          type: string
          format: date-time
        accountExists:
          type: boolean
      additionalProperties: false

    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          minLength: 40
          maxLength: 60
        password:
          type: string
          format: password
          minLength: 1
          description: New-account passwords require 12 characters and all passwords must fit bcrypt's 72-byte UTF-8 limit.
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
      additionalProperties: false

    AcceptInvitationResponse:
      type: object
      required: [success, organizationId, user]
      properties:
        success:
          type: boolean
        organizationId:
          type: string
          format: uuid
        user:
          type: object
          required: [id, email, firstName, lastName]
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
          additionalProperties: false
      additionalProperties: false

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role, platformRole]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
