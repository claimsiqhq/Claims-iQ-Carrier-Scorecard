        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /ingest:
    post:
      operationId: ingestClaimFile
      tags: [Intake, Jobs]
      summary: Upload and enqueue a claim file
      description: |
        Stores a file, creates a processing claim and document, and enqueues an
        `ingest` job. Requires `claims:create`. The idempotency identity includes
        the authenticated session-bound tenant, file SHA-256, requested
        `carrierEntityId`, and optional caller key. Equivalent requests return
        the existing job with `duplicate: true`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "202":
          description: File accepted and durable processing job created or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/processing-status:
    get:
      operationId: getClaimProcessingStatus
      tags: [Intake, Jobs]
      summary: Get the latest claim processing status
      description: |
        Requires `jobs:read`. Maps the latest durable job to the frontend
        `processing`, `error`, or `ready` state.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: Current claim workflow and latest job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessingStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/retry:
    post:
      operationId: retryClaimProcessing
      tags: [Intake, Jobs]
      summary: Retry claim processing
      description: |
        Requires `jobs:retry`. A latest failed, degraded, or cancelled job is
        reset in place; otherwise an equivalent retry job is created or reused.
        `X-Idempotency-Key` participates when a new retry job is needed.
        Archived claims return `409`.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Retry queued or an active equivalent job returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/reprocess:
    post:
      operationId: reprocessClaim
      tags: [Intake, Jobs]
      summary: Reprocess a claim with a carrier
      description: |
        Requires `audits:run`. Enqueues or reuses a `reprocess` job for the latest
        claim-file document. The idempotency identity includes the tenant-owned
        `carrierEntityId` and either `X-Idempotency-Key` or the current
        successful audit identity.
        Archived claims return `409`.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocessClaimRequest"
      responses:
        "202":
          description: Reprocessing queued or an equivalent active job returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/audit:
    post:
      operationId: enqueueClaimAudit
      tags: [Audits, Jobs]
      summary: Enqueue a carrier audit
      description: |
        Requires `audits:run`. Returns immediately with a durable `audit` job.
        Idempotency is scoped to the organization, claim, latest document, and
        either `X-Idempotency-Key` or the claim's current audit identity. Audit
        requests are limited to 10 per 15 minutes. Archived claims return `409`.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Audit job queued or an equivalent job returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /claims/{id}/processing-jobs:
    get:
      operationId: listClaimProcessingJobs
      tags: [Jobs]
      summary: List processing jobs for a claim
      description: Returns newest jobs first. Requires `jobs:read`.
      parameters:
