# Render Blueprint for Complete iQ Carrier Audit.
# The API and durable worker are paid Starter services so processing does not
# spin down mid-audit. Supabase remains the managed database and object store.

services:
  # Public Express API.
  - type: web
    name: complete-iq-carrier-audit-api
    runtime: node
    plan: starter
    region: oregon
    branch: master
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    preDeployCommand: pnpm --filter @workspace/api-server run migrate
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.6.0"

      # Supabase. Enter these values during initial Blueprint setup.
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE
        sync: false

      # Google Gemini. GEMINI_MODEL is intentionally Dashboard-managed so the
      # model can change without changing or resyncing this Blueprint.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMINI_VISION_MAX_PDF_PAGES
        value: "250"

      # Optional SendGrid integration.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_INBOUND_PARSE_TOKEN
        sync: false

      - key: ALLOWED_ORIGINS
        value: https://complete-iq-carrier-audit.onrender.com
      - key: LOG_LEVEL
        value: info
      - key: DURABLE_WORKER_ENABLED
        value: "false"

  # Dedicated Postgres-backed queue consumer.
  - type: worker
    name: complete-iq-carrier-audit-worker
    runtime: node
    plan: starter
    region: oregon
    branch: master
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.6.0"
      - key: SUPABASE_DATABASE_URL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: SUPABASE_DATABASE_URL
      - key: SUPABASE_URL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SERVICE_ROLE
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: SUPABASE_SERVICE_ROLE
      - key: GEMINI_API_KEY
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_MODEL
      - key: GEMINI_BASE_URL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_BASE_URL
      - key: GEMINI_VISION_MAX_PDF_PAGES
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_VISION_MAX_PDF_PAGES
      - key: LOG_LEVEL
        value: info

  # React/Vite frontend served from Render's CDN.
  - type: web
    name: complete-iq-carrier-audit
    runtime: static
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/claims-iq run build
    staticPublishPath: artifacts/claims-iq/dist/public
    envVars:
      - key: NODE_VERSION
        value: "24.6.0"
      - key: BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /api/*
        destination: https://complete-iq-carrier-audit-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
