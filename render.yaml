# Render Blueprint for Complete iQ Carrier Audit.
# The API and durable worker are paid Starter services so processing does not
# spin down mid-audit. Supabase remains the managed database and object store.

services:
  # Public Express API.
  - type: web
    name: complete-iq-carrier-audit-api
    runtime: node
    plan: starter
    region: oregon
    branch: master
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    preDeployCommand: pnpm --filter @workspace/api-server run migrate
    # Render exposes one service-level environment to both predeploy and runtime.
    # Strip release-only owner credentials before starting the long-running API.
    startCommand: env -u MIGRATION_DATABASE_URL -u MIGRATION_SUPABASE_SERVICE_ROLE pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.6.0"

      # Migration owner and four least-privilege runtime database planes.
      - key: MIGRATION_DATABASE_URL
        sync: false
      # Read only by the migration bundle during predeploy, then removed from
      # the environment inherited by the long-running API process.
      - key: MIGRATION_SUPABASE_SERVICE_ROLE
        sync: false
      - key: IDENTITY_DATABASE_URL
        sync: false
      - key: TENANT_DATABASE_URL
        sync: false
      - key: PLATFORM_DATABASE_URL
        sync: false
      - key: OPERATIONS_DATABASE_URL
        sync: false
      # Tenant-scoped Supabase Storage credentials. Long-running entrypoints
      # use only publishable credentials and scoped server-minted JWTs.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_STORAGE_JWT_TTL_SECONDS
        value: "60"

      # Google Gemini. GEMINI_MODEL is intentionally Dashboard-managed so the
      # model can change without changing or resyncing this Blueprint.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GEMINI_VISION_MAX_PDF_PAGES
        value: "250"

      # Optional SendGrid integration.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_INBOUND_PARSE_TOKEN
        sync: false

      - key: ALLOWED_ORIGINS
        value: https://scorecard.neurovista.ai,https://complete-iq-carrier-audit-iq6g.onrender.com
      - key: APP_PUBLIC_URL
        value: https://scorecard.neurovista.ai
      - key: PASSWORD_RESET_TTL_MINUTES
        value: "60"
      - key: INVITATION_TTL_HOURS
        value: "48"
      - key: PLATFORM_TENANT_ACCESS_TTL_MINUTES
        value: "60"
      - key: LOG_LEVEL
        value: info
      - key: DURABLE_WORKER_ENABLED
        value: "false"

  # Dedicated Postgres-backed queue consumer.
  - type: worker
    name: complete-iq-carrier-audit-worker
    runtime: node
    plan: starter
    region: oregon
    branch: master
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.6.0"
      - key: OPERATIONS_DATABASE_URL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: OPERATIONS_DATABASE_URL
      - key: SUPABASE_URL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_PUBLISHABLE_KEY
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: SUPABASE_PUBLISHABLE_KEY
      - key: SUPABASE_JWT_SECRET
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: SUPABASE_JWT_SECRET
      - key: SUPABASE_STORAGE_JWT_TTL_SECONDS
        value: "60"
      - key: GEMINI_API_KEY
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_MODEL
      - key: GEMINI_BASE_URL
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_BASE_URL
      - key: GEMINI_VISION_MAX_PDF_PAGES
        fromService:
          name: complete-iq-carrier-audit-api
          type: web
          envVarKey: GEMINI_VISION_MAX_PDF_PAGES
      - key: LOG_LEVEL
        value: info

  # React/Vite frontend served from Render's CDN.
  - type: web
    name: complete-iq-carrier-audit
    runtime: static
    branch: master
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@11.11.0 --activate && pnpm install --frozen-lockfile && BASE_PATH=/ pnpm --filter @workspace/claims-iq run build
    staticPublishPath: artifacts/claims-iq/dist/public
    envVars:
      - key: NODE_VERSION
        value: "24.6.0"
      - key: BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /api/*
        destination: https://complete-iq-carrier-audit-api-iq6g.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
